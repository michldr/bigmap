<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הבובות - הרפתקה ישראלית</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #ff85a2;
            --deep-pink: #f72585;
            --bright-blue: #4cc9f0;
            --soft-blue: #7209b7;
            --pure-white: #ffffff;
        }

        body { 
            font-family: 'Varela Round', sans-serif; 
            /* רקע משולב כחול וורוד בגרדיאנט אלכסוני */
            background: linear-gradient(135deg, var(--bright-blue) 0%, var(--soft-pink) 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* בועות רקע לקישוט - נותן תחושת משחק */
        body::before {
            content: "";
            position: absolute;
            width: 300px; height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px; left: -100px;
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); /* אפקט זכוכית הייטקי */
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            border: 8px solid var(--pure-white);
            text-align: center;
            position: relative;
        }

        h1 { 
            color: var(--deep-pink); 
            font-size: 32px; 
            font-weight: 900;
            margin-bottom: 35px;
            letter-spacing: -1px;
        }

        .field-group {
            margin-bottom: 25px;
            position: relative;
        }

        /* שדה בחירת עיר */
        select { 
            width: 100%; 
            padding: 18px; 
            border-radius: 25px; 
            font-size: 18px; 
            font-family: 'Varela Round', sans-serif;
            border: 3px solid var(--bright-blue);
            background: var(--pure-white);
            color: #444;
            cursor: pointer;
            appearance: none;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: bold;
        }

        select:focus {
            outline: none;
            border-color: var(--deep-pink);
            box-shadow: 0 0 15px rgba(247, 37, 133, 0.2);
        }

        /* שדה בחירת קובץ - עיצוב ורוד-לבן */
        .btn-file {
            background: var(--soft-pink);
            color: var(--pure-white);
            padding: 22px;
            border-radius: 25px;
            display: block;
            cursor: pointer;
            font-weight: bold;
            font-size: 19px;
            border: 4px solid var(--pure-white);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.3);
        }

        .btn-file:hover {
            transform: scale(1.02);
            background: var(--deep-pink);
        }

        input[type=file] { display: none; }

        /* כפתור שליחה - עיצוב כחול עמוק והייטקי */
        .send-btn { 
            width: 100%;
            padding: 20px;
            border-radius: 25px;
            background: var(--bright-blue); 
            color: var(--pure-white); 
            border: 4px solid var(--pure-white);
            font-size: 22px;
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(76, 201, 240, 0.4);
            font-family: 'Varela Round', sans-serif;
        }

        .send-btn:active {
            transform: translateY(5px);
            box-shadow: 0 4px 10px rgba(76, 201, 240, 0.4);
        }

        /* הכפתור הנסתר שלך - צבע גוף הרקע כדי שיבלע */
        .hidden-admin-link {
            width: 60px;
            height: 30px;
            margin-top: 50px;
            background: transparent;
            border: none;
            cursor: default;
            display: block;
            opacity: 0.1; /* כמעט בלתי נראה */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>באיזו עיר אתם גרים?</h1>
        
        <div class="field-group">
            <select id="city">
                <option>ירושלים</option>
                <option>תל אביב</option>
                <option>חיפה</option>
                <option>באר שבע</option>
                <optgroup label="צפון">
                    <option>קרית שמונה</option>
                    <option>יישובי אצבע הגליל</option>
                    <option>צפת</option>
                    <option>כרמיאל</option>
                    <option>נהריה</option>
                    <option>עכו</option>
                    <option>טבריה</option>
                    <option>יישובי עמק יזרעאל</option>
                    <option>עפולה</option>
                    <option>קריות</option>
                    <option>יקנעם</option>
                </optgroup>
                <optgroup label="מרכז">
                    <option>זכרון יעקב</option>
                    <option>חדרה</option>
                    <option>נתניה</option>
                    <option>יישובי השרון</option>
                    <option>רעננה</option>
                    <option>כפר סבא</option>
                    <option>הרצליה</option>
                    <option>פתח תקווה</option>
                    <option>רמת גן</option>
                    <option>בני ברק</option>
                    <option>גבעתיים</option>
                    <option>חולון</option>
                    <option>בת ים</option>
                    <option>ראשון לציון</option>
                    <option>נס ציונה</option>
                    <option>רחובות</option>
                    <option>יישובי גזר והסביבה</option>
                    <option>רמלה</option>
                    <option>לוד</option>
                    <option>מודיעין</option>
                    <option>בית שמש</option>
                </optgroup>
                <optgroup label="דרום">
                    <option>אשדוד</option>
                    <option>אשקלון</option>
                    <option>שדרות</option>
                    <option>יישובי עוטף עזה</option>
                    <option>נתיבות</option>
                    <option>אופקים</option>
                    <option>ערד</option>
                    <option>דימונה</option>
                    <option>יישובי הנגב</option>
                    <option>מצפה רמון</option>
                    <option>יישובי הערבה</option>
                    <option>אילת</option>
                </optgroup>
            </select>
        </div>

        <div class="field-group">
            <label class="btn-file">
                צלמו תמונה של הבובה שלכם
                <input type="file" id="photo" accept="image/*">
            </label>
        </div>

        <button class="send-btn" onclick="upload()">שלח למפה</button>
    </div>

    <a href="map.html" class="hidden-admin-link"></a>

    <script>
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function upload() {
            const file = document.getElementById('photo').files[0];
            const city = document.getElementById('city').value;
            if (!file) return alert("אופס! שכחתם לבחור תמונה");

            const reader = new FileReader();
            reader.onload = function(e) {
                database.ref('uploads').push({
                    city: city,
                    image: e.target.result,
                    time: Date.now()
                }).then(() => { 
                    alert("איזה יופי! התמונה בדרך למפה"); 
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
