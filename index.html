<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>העלאת יצירה</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial; text-align: center; background: #f0f0f0; padding: 20px; }
        select, input, button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 10px; border: 1px solid #ccc; }
        button { background: #0038b8; color: white; font-weight: bold; border: none; cursor: pointer; }
        .admin-link { margin-top: 50px; display: block; color: #666; text-decoration: none; font-size: 14px; border: 1px dashed #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h1>באיזו עיר אתם גרים?</h1>
   <select id="city">
    <option>קרית שמונה</option><option>יישובי אצבע הגליל</option><option>צפת</option>
    <option>כרמיאל</option><option>נהריה</option><option>עכו</option><option>טבריה</option>
    <option>יישובי עמק יזרעאל</option><option>עפולה</option><option>חיפה</option>
    <option>קריות</option><option>יקנעם</option><option>זכרון יעקב</option>
    <option>חדרה</option><option>נתניה</option><option>יישובי השרון</option>
    <option>רעננה</option><option>כפר סבא</option><option>הרצליה</option>
    <option>פתח תקווה</option><option>רמת גן</option><option>בני ברק</option>
    <option>תל אביב</option><option>גבעתיים</option><option>חולון</option>
    <option>בת ים</option>
    <option>ראשון לציון</option><option>נס ציונה</option><option>רחובות</option>
    <option>יישובי גזר והסביבה</option><option>רמלה</option><option>לוד</option>
    <option>מודיעין</option><option>ירושלים</option><option>בית שמש</option>
    <option>אשדוד</option><option>אשקלון</option><option>שדרות</option>
    <option>יישובי עוטף עזה</option><option>נתיבות</option><option>אופקים</option>
    <option>באר שבע</option><option>ערד</option><option>דימונה</option>
    <option>יישובי הנגב</option><option>מצפה רמון</option><option>יישובי הערבה</option>
    <option>אילת</option>
</select>
    <input type="file" id="photo" accept="image/*">
    <button onclick="upload()">שלח למפה! 🚀</button>

    <a href="map.html" class="admin-link">לחץ כאן כדי לפתוח את המפה (למקרן בלבד)</a>

    <script>
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function upload() {
            const file = document.getElementById('photo').files[0];
            const city = document.getElementById('city').value;
            if (!file) return alert("נא לבחור תמונה");

            const reader = new FileReader();
            reader.onload = function(e) {
                database.ref('uploads').push({
                    city: city,
                    image: e.target.result,
                    time: Date.now()
                }).then(() => { alert("התמונה עלתה למפה!"); });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>

</html>
