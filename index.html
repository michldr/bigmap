<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הבובות - הרפתקה ישראלית</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #ff85a2;
            --deep-pink: #f72585;
            --bright-blue: #4cc9f0;
            --pure-white: #ffffff;
        }

body {
    font-family: 'Varela Round', sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, var(--bright-blue) 0%, var(--soft-pink) 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            border: 8px solid var(--pure-white);
            text-align: center;
        }

        h1 { color: var(--deep-pink); font-size: 32px; font-weight: 900; margin-bottom: 35px; }
        .field-group { margin-bottom: 25px; }

        select { 
            width: 100%; padding: 18px; border-radius: 25px; font-size: 18px; 
            font-family: 'Varela Round', sans-serif; border: 3px solid var(--bright-blue);
            background: var(--pure-white); color: #444; font-weight: bold;
        }

        .btn-file {
            background: var(--soft-pink); color: var(--pure-white); padding: 22px;
            border-radius: 25px; display: block; cursor: pointer; font-weight: bold;
            font-size: 19px; border: 4px solid var(--pure-white);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.3);
        }

        input[type=file] { display: none; }

        .send-btn { 
            width: 100%; padding: 20px; border-radius: 25px; background: var(--bright-blue); 
            color: var(--pure-white); border: 4px solid var(--pure-white);
            font-size: 22px; font-weight: 800; cursor: pointer; 
            box-shadow: 0 10px 25px rgba(76, 201, 240, 0.4);
        }

        /* הכפתור הנסתר - עיגול בהיר בפינה */
        .admin-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: 0.3s;
        }
        /* עיצוב הודעת האישור החדשה */
        .custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            width: 80%;
            max-width: 300px;
            border: 5px solid var(--bright-blue);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        img { image-rendering: -webkit-optimize-contrast; }
    </style>
</head>
<body>
<div id="overlay" class="overlay"></div>
<div id="customAlert" class="custom-alert">
    <h2 style="color: var(--deep-pink); margin-top: 0;">איזה יופי!</h2>
    <p style="font-size: 18px; font-weight: bold;">התמונה בדרך למפה</p>
    <button onclick="location.reload()" class="send-btn" style="padding: 10px; font-size: 16px;">מעולה!</button>
</div>
    <div class="container">
        <h1>באיזו עיר אתם גרים?</h1>
        
        <div class="field-group">
            <select id="city">
                <option>ירושלים</option>
                <option>תל אביב</option>
                <option>חיפה</option>
                <option>באר שבע</option>
                <option>קרית שמונה</option>
                <option>צפת</option>
                <option>טבריה</option>
                <option>עפולה</option>
                <option>נהריה</option>
                <option>עכו</option>
                <option>כרמיאל</option>
                <option>קריות</option>
                <option>נתניה</option>
                <option>כפר סבא</option>
                <option>רעננה</option>
                <option>הרצליה</option>
                <option>חדרה</option>
                <option>פתח תקווה</option>
                <option>רמת גן</option>
                <option>גבעתיים</option>
                <option>בני ברק</option>
                <option>חולון</option>
                <option>בת ים</option>
                <option>ראשון לציון</option>
                <option>נס ציונה</option>
                <option>רחובות</option>
                <option>מודיעין</option>
                <option>בית שמש</option>
                <option>אשדוד</option>
                <option>אשקלון</option>
                <option>שדרות</option>
                <option>נתיבות</option>
                <option>אופקים</option>
                <option>ערד</option>
                <option>דימונה</option>
                <option>מצפה רמון</option>
                <option>אילת</option>
            </select>
        </div>

        <div class="field-group">
            <label class="btn-file">
                צלמו תמונה של הבובה שלכם
                <input type="file" id="photo" accept="image/*">
            </label>
        </div>

        <button class="send-btn" onclick="upload()">שלח למפה</button>
    </div>

    <a href="map.html" class="admin-trigger">★</a>

    <script>
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function upload() {
            const file = document.getElementById('photo').files[0];
            const city = document.getElementById('city').value;
            if (!file) return alert("אופס! שכחתם לבחור תמונה");

            const reader = new FileReader();
            reader.onload = function(e) {
                database.ref('uploads').push({
                    city: city, image: e.target.result, time: Date.now()
}).then(() => { 
            document.getElementById('customAlert').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
