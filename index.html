<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>העלאת יצירה - עולם הבובות</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;800&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #2ed573;
            --accent-color: #1e90ff;
            --bg-gradient: linear-gradient(135deg, #70a1ff, #5352ed);
        }

        body { 
            font-family: 'Varela Round', sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            border: 6px solid #ffde7d;
        }

        h1 { 
            color: #333; 
            font-size: 28px; 
            font-weight: 800;
            margin-bottom: 25px;
            text-shadow: 1px 1px 0px #eee;
        }

        .field-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 16px;
        }

        select, button { 
            width: 100%; 
            padding: 15px; 
            border-radius: 20px; 
            font-size: 18px; 
            font-family: 'Varela Round', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select {
            border: 3px solid #ddd;
            background: white;
            color: #333;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: left 15px center;
        }

        /* עיצוב כפתור בחירת קובץ */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .btn-file {
            background: white;
            border: 3px dashed var(--accent-color);
            color: var(--accent-color);
            padding: 20px;
            border-radius: 20px;
            display: block;
            cursor: pointer;
            font-weight: bold;
        }

        input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        button.send-btn { 
            background: #ff4757; 
            color: white; 
            border: none; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #b33939;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.send-btn:active {
            box-shadow: 0 2px 0 #b33939;
            transform: translateY(4px);
        }

        .admin-link { 
            margin-top: 30px; 
            display: inline-block; 
            color: #888; 
            text-decoration: none; 
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>באיזו עיר אתם גרים?</h1>
        
        <div class="field-group">
            <select id="city">
                <option>ירושלים</option>
                <option>תל אביב</option>
                <option>חיפה</option>
                <option>באר שבע</option>
                <option>קרית שמונה</option>
                <option>יישובי אצבע הגליל</option>
                <option>צפת</option>
                <option>כרמיאל</option>
                <option>נהריה</option>
                <option>עכו</option>
                <option>טבריה</option>
                <option>יישובי עמק יזרעאל</option>
                <option>עפולה</option>
                <option>קריות</option>
                <option>יקנעם</option>
                <option>זכרון יעקב</option>
                <option>חדרה</option>
                <option>נתניה</option>
                <option>יישובי השרון</option>
                <option>רעננה</option>
                <option>כפר סבא</option>
                <option>הרצליה</option>
                <option>פתח תקווה</option>
                <option>רמת גן</option>
                <option>בני ברק</option>
                <option>גבעתיים</option>
                <option>חולון</option>
                <option>בת ים</option>
                <option>ראשון לציון</option>
                <option>נס ציונה</option>
                <option>רחובות</option>
                <option>יישובי גזר והסביבה</option>
                <option>רמלה</option>
                <option>לוד</option>
                <option>מודיעין</option>
                <option>בית שמש</option>
                <option>אשדוד</option>
                <option>אשקלון</option>
                <option>שדרות</option>
                <option>יישובי עוטף עזה</option>
                <option>נתיבות</option>
                <option>אופקים</option>
                <option>ערד</option>
                <option>דימונה</option>
                <option>יישובי הנגב</option>
                <option>מצפה רמון</option>
                <option>יישובי הערבה</option>
                <option>אילת</option>
            </select>
        </div>

        <div class="field-group file-upload-wrapper">
            <label class="btn-file">
                צלמו תמונה של הבובה שלכם
                <input type="file" id="photo" accept="image/*">
            </label>
        </div>

        <button class="send-btn" onclick="upload()">שלח למפה</button>

        <a href="map.html" class="admin-link">צפייה במפה</a>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function upload() {
            const file = document.getElementById('photo').files[0];
            const city = document.getElementById('city').value;
            if (!file) return alert("אופס! שכחתם לבחור תמונה");

            const reader = new FileReader();
            reader.onload = function(e) {
                database.ref('uploads').push({
                    city: city,
                    image: e.target.result,
                    time: Date.now()
                }).then(() => { 
                    alert("איזה יופי! התמונה בדרך למפה"); 
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
