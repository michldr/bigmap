<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הבובות - הרפתקה ישראלית</title>

    <style>
        :root {
            --soft-pink: #ff85a2;
            --deep-pink: #f72585;
            --bright-blue: #4cc9f0;
            --pure-white: #ffffff;
        }

        body { 
            font-family: 'Varela Round', sans-serif; 
            background: linear-gradient(135deg, var(--bright-blue) 0%, var(--soft-pink) 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            border: 8px solid var(--pure-white);
            text-align: center;
        }

        h1 { 
            color: var(--deep-pink); 
            font-size: 32px; 
            font-weight: 900;
            margin-bottom: 35px;
        }

        .field-group { margin-bottom: 25px; }

        select { 
            width: 100%; 
            padding: 18px; 
            border-radius: 25px; 
            font-size: 18px; 
            font-family: 'Varela Round', sans-serif;
            border: 3px solid var(--bright-blue);
            background: var(--pure-white);
            color: #444;
            text-align: center;
            font-weight: bold;
        }

        .btn-file {
            background: var(--soft-pink);
            color: var(--pure-white);
            padding: 22px;
            border-radius: 25px;
            display: block;
            cursor: pointer;
            font-weight: bold;
            font-size: 19px;
            border: 4px solid var(--pure-white);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.3);
        }

        input[type=file] { display: none; }

        .send-btn { 
            width: 100%;
            padding: 20px;
            border-radius: 25px;
            background: var(--bright-blue); 
            color: var(--pure-white); 
            border: 4px solid var(--pure-white);
            font-size: 22px;
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(76, 201, 240, 0.4);
        }
