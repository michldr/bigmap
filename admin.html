<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול בובות - מחיקת תמונות</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Varela Round', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        h1 { color: #f72585; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .photo-card { background: white; padding: 10px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        .photo-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .city-tag { font-size: 14px; font-weight: bold; margin-top: 5px; display: block; }
        .delete-btn { 
            background: #ff4d4d; color: white; border: none; padding: 8px; 
            border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%;
        }
        .delete-btn:hover { background: #cc0000; }
    </style>
</head>
<body>
    <h1>ניהול בובות במפה</h1>
    <p>כאן אפשר למחוק תמונות שלא מתאימות</p>
    <div class="gallery" id="gallery"></div>

    <script>
        // חיבור ל-Firebase שלך
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // הצגת כל התמונות
        database.ref('uploads').on('value', (snapshot) => {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = ''; // ניקוי הגלריה לפני טעינה מחדש
            
            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                const id = childSnapshot.key;

                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${data.image}">
                    <span class="city-tag">${data.city}</span>
                    <button class="delete-btn" onclick="deleteItem('${id}')">מחק תמונה</button>
                `;
                gallery.appendChild(card);
            });
        });

        // פונקציית המחיקה
        function deleteItem(id) {
            if (confirm('בטוח שרוצה למחוק את התמונה הזו מהמפה?')) {
                database.ref('uploads/' + id).remove()
                .then(() => alert('התמונה נמחקה בהצלחה'))
                .catch((error) => alert('שגיאה במחיקה: ' + error.message));
            }
        }
    </script>
</body>
</html>
