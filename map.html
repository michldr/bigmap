<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מפת ארץ ישראל - תצוגת בובות</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .map-container { 
            position: relative; 
            display: inline-block; 
            border: 5px solid #FFD700; 
            border-radius: 15px; 
        }

        #main-map { height: 92vh; display: block; border-radius: 10px; }

        .user-photo-wrapper {
            position: absolute;
            transform: translate(-50%, -100%);
            text-align: center;
            z-index: 100;
        }

        .user-photo-wrapper img { 
            width: 80px; height: 80px; object-fit: cover; 
            border-radius: 50%; border: 3px solid white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
        }

        .city-name {
            display: block; background: white; color: #333;
            padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="map-container">
    <img src="israel.map.png" id="main-map">
    <div id="photos-layer"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const cityCoords = {
    "חיפה": { left: 48.1, top: 23.2 },
    "נתניה": { left: 45.4, top: 33.1 },
    "רמת גן": { left: 45.2, top: 37.8 },
    "תל אביב": { left: 44.0, top: 38.3 },
    "בת ים": { left: 43.8, top: 39.5 },
    "חולון": { left: 44.5, top: 39.8 },
    "ראשון לציון": { left: 44.8, top: 41.2 },
    "נס ציונה": { left: 44.9, top: 42.5 },
    "רחובות": { left: 45.1, top: 43.8 },
    "מודיעין": { left: 49.5, top: 41.5 },
    "אשדוד": { left: 41.6, top: 44.2 },
    "ירושלים": { left: 52.2, top: 44.7 },
    "באר שבע": { left: 44.1, top: 55.9 },
    "טבריה": { left: 56.1, top: 22.1 },
    "צפת": { left: 55.5, top: 18.5 },
    "אילת": { left: 47.1, top: 91.4 }
};

    // שימוש ב-child_added כדי שכל בובה תתווסף בנפרד בלי למחוק את הקודמות
    database.ref('uploads').on('child_added', (snapshot) => {
        const data = snapshot.val();
        const coords = cityCoords[data.city];

        if (coords) {
            const layer = document.getElementById('photos-layer');
            const div = document.createElement('div');
            div.className = 'user-photo-wrapper';
            div.style.left = coords.left + '%';
            div.style.top = coords.top + '%';
            
            div.innerHTML = `<img src="${data.image}"><span class="city-name">${data.city}</span>`;
            layer.appendChild(div);
        }
    });
</script>
</body>

</html>
