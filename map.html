<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מפת ארץ ישראל - מקבצי אליפסות</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; background: #1a1a1a; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; font-family: sans-serif; 
        }
        
        .map-container { 
            position: relative; 
            display: inline-block; 
            border: 2px solid #444; 
            border-radius: 15px; 
        }

        #main-map { height: 92vh; display: block; border-radius: 10px; }

     /* נצנוץ לבן עדין */
@keyframes subtleWhiteTwinkle {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255,255,255,0.4)); }
    50% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.8)); }
}

.user-photo-wrapper img { 
    width: 65px; 
    height: 90px; 
    object-fit: cover; 
    border-radius: 50%; /* אליפסה */
    border: 2px solid rgba(255, 255, 255, 0.9);
    animation: subtleWhiteTwinkle 3s infinite ease-in-out;
    background: #000;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.5); /* צל ליצירת עומק בחפיפה */
}

        .user-photo-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .user-photo-wrapper img { 
            width: 75px; 
            height: 100px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 2px solid #fff;
            animation: subtleWhiteTwinkle 3s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        /* עיצוב למקבץ (כשיש כמה בעיר אחת) */
        .user-photo-wrapper.in-cluster img {
            width: 50px;
            height: 70px;
            border-width: 1.5px;
        }

        .city-name {
            display: block; 
            background: rgba(255, 255, 255, 0.9); 
            color: #333; 
            padding: 1px 6px; 
            border-radius: 8px; 
            font-size: 10px; 
            font-weight: bold;
            margin-top: 3px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="map-container">
    <img src="israel.map.png" id="main-map">
    <div id="photos-layer"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const cityCoords = {
        "ירושלים": { left: 52.2, top: 44.7 }, "תל אביב": { left: 44.0, top: 38.3 },
        "חיפה": { left: 48.1, top: 23.2 }, "באר שבע": { left: 44.1, top: 55.9 },
        "קרית שמונה": { left: 56.5, top: 12.5 }, "צפת": { left: 55.5, top: 18.5 },
        "טבריה": { left: 56.1, top: 22.1 }, "עפולה": { left: 51.5, top: 27.5 },
        "נהריה": { left: 49.5, top: 18.0 }, "עכו": { left: 49.0, top: 20.0 },
        "כרמיאל": { left: 53.0, top: 19.5 }, "קריות": { left: 49.2, top: 22.5 },
        "נתניה": { left: 45.4, top: 33.1 }, "כפר סבא": { left: 47.5, top: 35.8 },
        "רעננה": { left: 46.2, top: 35.5 }, "הרצליה": { left: 45.0, top: 36.5 },
        "חדרה": { left: 46.5, top: 31.0 }, "פתח תקווה": { left: 47.2, top: 38.0 },
        "רמת גן": { left: 45.2, top: 37.8 }, "גבעתיים": { left: 45.1, top: 38.5 },
        "בני ברק": { left: 45.8, top: 37.9 }, "חולון": { left: 44.5, top: 39.8 },
        "בת ים": { left: 43.8, top: 39.5 }, "ראשון לציון": { left: 44.8, top: 41.2 },
        "נס ציונה": { left: 44.9, top: 42.5 }, "רחובות": { left: 45.1, top: 43.8 },
        "מודיעין": { left: 49.5, top: 41.5 }, "בית שמש": { left: 48.5, top: 46.5 },
        "אשדוד": { left: 41.6, top: 44.2 }, "אשקלון": { left: 39.5, top: 47.5 },
        "שדרות": { left: 40.5, top: 49.5 }, "נתיבות": { left: 39.8, top: 52.1 },
        "אופקים": { left: 41.0, top: 53.5 }, "ערד": { left: 51.5, top: 56.5 },
        "דימונה": { left: 50.5, top: 60.5 }, "מצפה רמון": { left: 44.5, top: 71.2 },
        "אילת": { left: 47.1, top: 91.4 }
    };

    const activeCitiesCount = {};

    database.ref('uploads').on('child_added', (snapshot) => {
        const data = snapshot.val();
        const coords = cityCoords[data.city];

        if (coords) {
            const layer = document.getElementById('photos-layer');
            
            // ניהול תור 30 בובות
            if (layer.children.length >= 30) {
                const first = layer.firstChild;
                const cityKey = first.getAttribute('data-city');
                activeCitiesCount[cityKey]--;
                layer.removeChild(first);
            }

            const div = document.createElement('div');
            div.className = 'user-photo-wrapper';
            div.setAttribute('data-city', data.city);

          // לוגיקת כיווץ דינמי ומעגל
            const count = activeCitiesCount[data.city] || 0;
            activeCitiesCount[data.city] = count + 1;
            
            // חישוב אחוז הקטנה: 10% לכל תמונה נוספת (מינימום 50% מהגודל המקורי)
            const scaleFactor = Math.max(0.5, 1 - (count * 0.1));
            
            // עדכון כל התמונות הקיימות מאותה עיר לגודל החדש
            document.querySelectorAll(`.user-photo-wrapper[data-city="${data.city}"] img`).forEach(existingImg => {
                existingImg.style.transform = `scale(${scaleFactor})`;
            });

            // מיקום במעגל
            const radius = count === 0 ? 0 : 3.5; 
            const angle = (count * 60) * (Math.PI / 180);
            const offsetX = Math.cos(angle) * radius;
            const offsetY = Math.sin(angle) * radius;

            div.style.left = (coords.left + offsetX) + '%';
            div.style.top = (coords.top + offsetY) + '%';
            div.style.zIndex = 100 + count;

            div.innerHTML = `
                <img src="${data.image}" style="transform: scale(${scaleFactor})">
                <span class="city-name">${data.city}</span>
            `;
            layer.appendChild(div);
            layer.appendChild(div);
        }
    });
</script>
</body>
</html>
