<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מפת היצירות שלי</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: Arial; }
        #map-container {
            position: relative; 
            width: 100vw; 
            height: 100vh;
            background-image: url('israel.png'); /* פה הקוד מחפש את התמונה שלך */
            background-repeat: no-repeat; 
            background-position: center; 
            background-size: contain;
        }
        #sign { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            background: white; padding: 10px 30px; border: 4px solid #0038b8; 
            border-radius: 50px; font-size: 28px; font-weight: bold; color: #0038b8; z-index: 100; 
        }
        .photo-card { 
            position: absolute; width: 100px; background: white; border: 2px solid #333; 
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: pop 0.5s ease-out;
        }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .city-tag { background: #ffcc00; color: #333; font-size: 12px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="sign">✡ ארץ ישראל שלי ✡</div>
    </div>
    <script>
        // החיבור ל-Firebase שלך
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        
        // מיקומים גנריים על המפה - תוכלי להזיז אותם אם צריך
        const cityPositions = { 
            "צפת": {top:"15%",left:"55%"}, "טבריה": {top:"22%",left:"56%"}, 
            "חיפה": {top:"20%",left:"50%"}, "נתניה": {top:"35%",left:"48%"}, 
            "תל אביב": {top:"42%",left:"47%"}, "מודיעין": {top:"48%",left:"50%"}, 
            "ירושלים": {top:"52%",left:"52%"}, "אשדוד": {top:"50%",left:"45%"}, 
            "באר שבע": {top:"65%",left:"45%"}, "אילת": {top:"90%",left:"52%"} 
        };

        firebase.database().ref('uploads').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const pos = cityPositions[data.city] || { top: "50%", left: "50%" };
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.style.top = pos.top; card.style.left = pos.left;
            card.innerHTML = `<img src="${data.image}" style="width:100%; display:block; border-radius:6px 6px 0 0;"><div class="city-tag">${data.city}</div>`;
            document.getElementById('map-container').appendChild(card);
        });
    </script>
</body>
</html>
