<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ארץ ישראל שלי - מפת יצירות</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { margin: 0; background: #87CEEB; overflow: hidden; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #map-container { position: relative; height: 90vh; aspect-ratio: 0.4; }
        svg { width: 100%; height: 100%; filter: drop-shadow(10px 10px 0px rgba(0,0,0,0.1)); }
        .land { fill: #44cc44; stroke: #225522; stroke-width: 1; }
        #sign { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 30px; border: 4px solid #0038b8; border-radius: 50px; font-size: 28px; font-weight: bold; color: #0038b8; z-index: 100; display: flex; align-items: center; gap: 15px; }
        .photo-card { position: absolute; width: 80px; background: white; border: 2px solid #333; border-radius: 8px; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); animation: pop 0.5s ease-out; }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
        .city-tag { background: #ffcc00; color: #333; font-size: 10px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div id="sign"><span>✡</span><span>ארץ ישראל שלי</span><span>✡</span></div>
    <div id="map-container">
        <svg viewBox="0 0 100 250"><path class="land" d="M62,5 L72,8 L78,15 L78,25 L82,35 L80,45 L82,55 L78,70 L75,85 L76,100 L72,115 L70,130 L72,145 L75,160 L70,180 L68,200 L72,220 L70,235 L68,245 L62,240 L58,225 L52,205 L48,190 L45,170 L46,150 L42,135 L40,120 L42,100 L48,80 L52,60 L54,40 L52,25 L55,10 Z" /></svg>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://bubot-mekomiot-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const cityPositions = { "צפת": {top:"12%",left:"62%"}, "טבריה": {top:"18%",left:"65%"}, "חיפה": {top:"20%",left:"48%"}, "נתניה": {top:"33%",left:"45%"}, "תל אביב": {top:"40%",left:"42%"}, "מודיעין": {top:"45%",left:"55%"}, "ירושלים": {top:"50%",left:"58%"}, "אשדוד": {top:"49%",left:"40%"}, "באר שבע": {top:"65%",left:"45%"}, "אילת": {top:"90%",left:"60%"} };
        firebase.database().ref('uploads').on('child_added', (snapshot) => {
            const data = snapshot.val();
            const pos = cityPositions[data.city] || { top: "50%", left: "50%" };
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.style.top = pos.top; card.style.left = pos.left;
            card.innerHTML = `<img src="${data.image}" style="width:100%; display:block;"><div class="city-tag">${data.city}</div>`;
            document.body.appendChild(card);
        });
    </script>
</body>
</html>
